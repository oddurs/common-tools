name: Feature request
description: Suggest a reading, a display style, or a behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to see or do that Common Battery doesn't support?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested approach
      description: For a new reading, say where the data comes from if you know. Common Battery only uses public, unprivileged sources.
