name: Site problem
description: Something on the site is wrong, broken, or out of date.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: 'https://oddurs.github.io/common-tools/stats/docs/'
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: For a problem with an app itself, open the issue in that app's repository instead.
    validations:
      required: true
