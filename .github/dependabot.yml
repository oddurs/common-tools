# The apps have no Swift package dependencies, so there are two ecosystems to watch: GitHub Actions
# and the site's npm packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      dependencies:
        update-types: [minor, patch]
