name: Release

# A tag <app>-v<version> releases one app: scripts/release makes the tag once the version bump
# has merged.
on:
  push:
    tags: ['*-v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Read the tag
        id: tag
        run: |
          app="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          [ -d "apps/$app" ] || { echo "no app '$app' for tag $GITHUB_REF_NAME"; exit 1; }
          plist="apps/$app/Resources/Info.plist"
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          [ "$built" = "$version" ] || { echo "$plist says $built, the tag says $version"; exit 1; }
          echo "app=$app" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" >>"$GITHUB_OUTPUT"
      - run: scripts/task check kit ${{ steps.tag.outputs.app }}
      - name: Package
        # Zip, disk image, and checksums. Signed with a Developer ID and notarized once the five
        # secrets exist (docs/signing.md); until then scripts/notarize says so and the build's
        # ad-hoc signature stays.
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/task package ${{ steps.tag.outputs.app }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.tag.outputs.app }}
          VERSION: ${{ steps.tag.outputs.version }}
          NAME: ${{ steps.tag.outputs.name }}
        run: |
          # The notes are this version's CHANGELOG section, the same text the site shows.
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { on = 1; next } on && (/^## / || /^\[/) { exit } on { print }' \
            "apps/$APP/CHANGELOG.md" >notes.md
          [ -s notes.md ] || { echo "apps/$APP/CHANGELOG.md has no section for $VERSION"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$NAME $VERSION" --notes-file notes.md "dist/$APP"/*
      - name: Update the Homebrew cask
        # Writes Casks/<app>.rb in oddurs/homebrew-common-tools. TAP_TOKEN is a fine-grained token
        # with contents: write on that repository; without it, the step says how to do it by hand.
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          APP: ${{ steps.tag.outputs.app }}
          VERSION: ${{ steps.tag.outputs.version }}
          GIT_AUTHOR_NAME: ${{ github.repository_owner }}
          GIT_AUTHOR_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.repository_owner }}
          GIT_COMMITTER_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::No TAP_TOKEN secret, so the Homebrew cask wasn't updated. Run: scripts/cask $APP $VERSION --push"
            exit 0
          fi
          scripts/cask "$APP" "$VERSION" --push
