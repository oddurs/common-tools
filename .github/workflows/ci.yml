name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Everything, once a week and by hand: a push checks only what changed, so a runner image or
  # toolchain update that breaks an area nobody touched shows here. It also keeps every area's
  # build cache from aging out.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  # A pull request's newer push replaces its older run. Each push to main runs to the end, in a
  # group of its own: it checks what changed since the last green run, so none may be dropped.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    # Which areas to check: the site, CommonKit, and each app (CommonKit counts for every app).
    # A pull request checks what it changes. A push to main checks what changed since main's last
    # green run: the pull request already passed on its own head, and a failed run's areas are
    # checked again by every push after it until one passes. A change to this workflow, the weekly
    # run, and a run by hand check everything.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      site: ${{ steps.areas.outputs.site }}
      kit: ${{ steps.areas.outputs.kit }}
      apps: ${{ steps.areas.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_EVENT_NAME" in
          pull_request)
            git fetch --quiet origin "$GITHUB_BASE_REF"
            since="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
            ;;
          push)
            since="$(gh run list --workflow ci.yml --branch "$GITHUB_REF_NAME" --event push --status success --limit 20 \
              --json headSha --jq '.[].headSha' | while read -r sha; do
                if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then echo "$sha"; break; fi
              done)"
            ;;
          *) since="" ;;
          esac
          if [ -z "$since" ] || ! git diff --quiet "$since" HEAD -- .github/workflows/ci.yml; then
            echo "checking everything"
            areas="$(scripts/task areas --all)"
          else
            echo "checking what changed since $since"
            areas="$(scripts/task areas "$since..HEAD")"
          fi
          echo "areas: $areas"
          echo "site=$(echo "$areas" | grep -qx site && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "kit=$(echo "$areas" | grep -qx kit && echo true || echo false)" >>"$GITHUB_OUTPUT"
          echo "apps=$(echo "$areas" | grep -vx 'site\|kit' | grep -v '^$' | jq -R . | jq -sc .)" >>"$GITHUB_OUTPUT"

  site:
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: scripts/task check site
        env:
          # The site reads each app's latest release from the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}

  kit:
    needs: plan
    if: needs.plan.outputs.kit == 'true'
    # Pinned to the image whose Swift matches development; swift-format's output changes between
    # releases, so a drifting runner fails lint.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: swift
        run: scripts/ci-cache-prepare
      - uses: actions/cache/restore@v6
        with:
          path: packages/CommonKit/.build
          key: swift-kit-${{ steps.swift.outputs.toolchain }}-${{ github.sha }}
          restore-keys: swift-kit-${{ steps.swift.outputs.toolchain }}-
      - run: scripts/task check kit
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: packages/CommonKit/.build
          key: swift-kit-${{ steps.swift.outputs.toolchain }}-${{ github.sha }}

  app:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: swift
        run: scripts/ci-cache-prepare
      # Pull requests read the cache main's runs leave; only main writes one, so a pull request
      # can't fill the cache with builds of code that never merged.
      - uses: actions/cache/restore@v6
        with:
          path: apps/${{ matrix.app }}/.build
          key: swift-${{ matrix.app }}-${{ steps.swift.outputs.toolchain }}-${{ github.sha }}
          restore-keys: swift-${{ matrix.app }}-${{ steps.swift.outputs.toolchain }}-
      - run: scripts/task check ${{ matrix.app }} 2>&1 | tee check.log
        # bash, not the default sh: the pipe must fail when check does.
        shell: bash
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: apps/${{ matrix.app }}/.build
          key: swift-${{ matrix.app }}-${{ steps.swift.outputs.toolchain }}-${{ github.sha }}
      # The built app has to start and stay up; nothing in check launches it.
      - run: scripts/task smoke ${{ matrix.app }}
      - if: always()
        run: grep -h "Test run with" check.log >>"$GITHUB_STEP_SUMMARY" || echo "no tests ran" >>"$GITHUB_STEP_SUMMARY"

  required:
    # The single status check branch protection requires. It passes when every job that ran passed.
    needs: [plan, site, kit, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "plan: ${{ needs.plan.result }}, site: ${{ needs.site.result }}, kit: ${{ needs.kit.result }}, apps: ${{ needs.app.result }}"
          case "${{ needs.plan.result }}${{ needs.site.result }}${{ needs.kit.result }}${{ needs.app.result }}" in
          *failure* | *cancelled*) exit 1 ;;
          esac
