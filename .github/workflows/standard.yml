name: Standard

# Checks that Common Stats, Common Keys, and Common Bar still follow the app standard in standard/.
# It can't block their pull requests, so it runs daily and whenever the standard changes on main,
# and a failure here is the signal to re-apply. Not on pull requests: a change to the standard is
# expected to differ from the apps until it has been applied to them.

on:
  push:
    branches: [main]
    paths: ['standard/**', 'scripts/standard.js', '.github/workflows/standard.yml']
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Clone the published apps
        run: for repo in $(node scripts/standard.js repos); do git clone --quiet --depth 1 "https://github.com/oddurs/$repo" "apps/$repo"; done
      - run: node scripts/standard.js check --from apps
