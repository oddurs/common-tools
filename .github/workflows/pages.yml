name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'apps/*/CHANGELOG.md', '.github/workflows/pages.yml']
  # Rebuild daily, so a new app release shows its version and notes without a change here.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: scripts/task build site
        env:
          # Pages serves the site under /common-tools.
          BASE_PATH: /common-tools
          # The build reads each app's latest release from the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build
      - id: deployment
        uses: actions/deploy-pages@v4
